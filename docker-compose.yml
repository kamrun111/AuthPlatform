services:
  authplatform-api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: authplatform-api-container
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"

  authplatform-mvc:
    build:
      context: .
      dockerfile: Dockerfile.Mvc
    container_name: authplatform-mvc-container
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ApiSettings__BaseUrl: "${MVC_API_BASE_URL}"
    depends_on:
      - authplatform-api
